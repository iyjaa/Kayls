name: Release

on:
  push:
    tags:
      - 'Tsc-v*'
      - 'Tsc-s*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../tscode-x86_64-unknown-linux-gnu.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: tscode-x86_64-unknown-linux-gnu.tar.gz

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target aarch64-unknown-linux-gnu -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar -czf ../../../tscode-aarch64-unknown-linux-gnu.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: tscode-aarch64-unknown-linux-gnu.tar.gz

  build-linux-armv7:
    name: Build Linux ARM32 (ARMv7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target armv7-unknown-linux-gnueabihf -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/armv7-unknown-linux-gnueabihf/release
          tar -czf ../../../tscode-armv7-unknown-linux-gnueabihf.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7
          path: tscode-armv7-unknown-linux-gnueabihf.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/x86_64-apple-darwin/release
          tar -czf ../../../tscode-x86_64-apple-darwin.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: tscode-x86_64-apple-darwin.tar.gz

  build-macos-aarch64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-aarch64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/aarch64-apple-darwin/release
          tar -czf ../../../tscode-aarch64-apple-darwin.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: tscode-aarch64-apple-darwin.tar.gz

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-linux-armv7
      - build-macos-x86_64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}