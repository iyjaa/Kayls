name: Release

on:
  push:
    tags:
      - 'Kayls-v*'
      - 'Kayls-s*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p kayls
      - name: Package binary (tar.gz)
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../kayls-x86_64-unknown-linux-gnu.tar.gz kayls
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: kayls-x86_64-unknown-linux-gnu.tar.gz

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release binary
        run: cross build --release --target aarch64-unknown-linux-gnu -p kayls
      - name: Package binary (tar.gz)
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar -czf ../../../kayls-aarch64-unknown-linux-gnu.tar.gz kayls
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: kayls-aarch64-unknown-linux-gnu.tar.gz

  build-linux-armv7:
    name: Build Linux ARM32 (ARMv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release binary
        run: cross build --release --target armv7-unknown-linux-gnueabihf -p kayls
      - name: Package binary (tar.gz)
        run: |
          cd target/armv7-unknown-linux-gnueabihf/release
          tar -czf ../../../kayls-armv7-unknown-linux-gnueabihf.tar.gz kayls
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7
          path: kayls-armv7-unknown-linux-gnueabihf.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-x86_64-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin -p kayls
      - name: Package binary (tar.gz)
        run: |
          cd target/x86_64-apple-darwin/release
          tar -czf ../../../kayls-x86_64-apple-darwin.tar.gz kayls
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: kayls-x86_64-apple-darwin.tar.gz

  build-macos-aarch64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-aarch64-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin -p kayls
      - name: Package binary (tar.gz)
        run: |
          cd target/aarch64-apple-darwin/release
          tar -czf ../../../kayls-aarch64-apple-darwin.tar.gz kayls
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: kayls-aarch64-apple-darwin.tar.gz

  build-deb-and-push:
    name: Build DEB & Push to APT Repo
    needs:
      - build-linux-x86_64
      - build-linux-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
      - name: Extract binaries
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          tar -xzf kayls-x86_64-unknown-linux-gnu.tar.gz -C binaries/amd64
          tar -xzf kayls-aarch64-unknown-linux-gnu.tar.gz -C binaries/arm64
      - name: Get version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#Kayls-}
          VERSION=${VERSION#v}
          VERSION=${VERSION#s}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Build amd64 .deb
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p /tmp/deb-amd64/DEBIAN /tmp/deb-amd64/usr/bin
          cp binaries/amd64/kayls /tmp/deb-amd64/usr/bin/
          cat > /tmp/deb-amd64/DEBIAN/control <<EOF
          Package: kayls
          Version: $VERSION
          Architecture: amd64
          Maintainer: izra mulya putra G. <izramulyaputra@gmail.com>
          Section: utils
          Priority: optional
          Description: Kayls — A terminal-based IDE
          EOF
          dpkg-deb --build --root-owner-group /tmp/deb-amd64 kayls_${VERSION}_amd64.deb
      - name: Build arm64 .deb
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p /tmp/deb-arm64/DEBIAN /tmp/deb-arm64/usr/bin
          cp binaries/arm64/kayls /tmp/deb-arm64/usr/bin/
          cat > /tmp/deb-arm64/DEBIAN/control <<EOF
          Package: kayls
          Version: $VERSION
          Architecture: arm64
          Maintainer: izra mulya putra G. <izramulyaputra@gmail.com>
          Section: utils
          Priority: optional
          Description: Kayls — A terminal-based IDE
          EOF
          dpkg-deb --build --root-owner-group /tmp/deb-arm64 kayls_${VERSION}_arm64.deb
      - name: Clone APT Repo
        uses: actions/checkout@v4
        with:
          repository: iyjaa/Kayls-repo
          token: ${{ secrets.REPO_TOKEN }}
          path: apt-repo
      - name: Copy .deb to APT Repo pool
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p apt-repo/pool/main/t/kayls
          cp kayls_${VERSION}_amd64.deb apt-repo/pool/main/t/kayls/
          cp kayls_${VERSION}_arm64.deb apt-repo/pool/main/t/kayls/
      - name: Commit & Push to APT Repo
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool/
          git commit -m "auto: add kayls v${VERSION} DEBs" || echo "No changes"
          git push

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-linux-armv7
      - build-macos-x86_64
      - build-macos-aarch64
      - build-deb-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
