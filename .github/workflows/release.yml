name: Release

on:
  push:
    tags:
      - 'Tsc-v*'
      - 'Tsc-s*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-and-push:
  name: Build DEB & Push to APT Repo
  needs:
    - build-linux-x86_64
    - build-linux-arm64
  runs-on: ubuntu-latest
  if: startsWith(github.ref, 'refs/tags/')

  steps:
    - name: Download amd64 binary
      uses: actions/download-artifact@v4
      with:
        name: linux-x86_64

    - name: Download arm64 binary
      uses: actions/download-artifact@v4
      with:
        name: linux-aarch64

    - name: Extract binaries
      run: |
        mkdir -p binaries/amd64 binaries/arm64
        tar -xzf tscode-x86_64-unknown-linux-gnu.tar.gz -C binaries/amd64
        tar -xzf tscode-aarch64-unknown-linux-gnu.tar.gz -C binaries/arm64

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/Tsc-}" | sed 's/^v//' >> $GITHUB_OUTPUT
      # Catatan: karena tag kamu formatnya Tsc-v1.1.4 atau Tsc-s1.1.4,
      # kita ambil apa pun setelah "Tsc-" lalu hapus "v" atau "s" di awal.

    - name: Build amd64 .deb
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mkdir -p /tmp/deb-amd64/DEBIAN /tmp/deb-amd64/usr/bin
        cp binaries/amd64/tscode /tmp/deb-amd64/usr/bin/
        cat > /tmp/deb-amd64/DEBIAN/control <<EOF
        Package: tscode
        Version: $VERSION
        Architecture: amd64
        Maintainer: izra mulya putra G. <izramulyaputra@gmail.com>
        Section: utils
        Priority: optional
        Description: Terminal Studio Code — A terminal-based IDE inspired by VS Code
        EOF
        dpkg-deb --build --root-owner-group /tmp/deb-amd64 tscode_${VERSION}_amd64.deb

    - name: Build arm64 .deb
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mkdir -p /tmp/deb-arm64/DEBIAN /tmp/deb-arm64/usr/bin
        cp binaries/arm64/tscode /tmp/deb-arm64/usr/bin/
        cat > /tmp/deb-arm64/DEBIAN/control <<EOF
        Package: tscode
        Version: $VERSION
        Architecture: arm64
        Maintainer: izra mulya putra G. <izramulyaputra@gmail.com>
        Section: utils
        Priority: optional
        Description: Terminal Studio Code — A terminal-based IDE inspired by VS Code
        EOF
        dpkg-deb --build --root-owner-group /tmp/deb-arm64 tscode_${VERSION}_arm64.deb

    - name: Clone APT Repo
      uses: actions/checkout@v4
      with:
        repository: iyjaa/Tscode-repo
        token: ${{ secrets.REPO_TOKEN }}
        path: apt-repo

    - name: Copy .deb to APT Repo pool
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mkdir -p apt-repo/pool/main/t/tscode
        cp tscode_${VERSION}_amd64.deb apt-repo/pool/main/t/tscode/
        cp tscode_${VERSION}_arm64.deb apt-repo/pool/main/t/tscode/

    - name: Commit & Push to APT Repo
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        cd apt-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pool/
        git commit -m "auto: add tscode v${VERSION} DEBs" || echo "No changes"
        git push
        
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../tscode-x86_64-unknown-linux-gnu.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: tscode-x86_64-unknown-linux-gnu.tar.gz

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target aarch64-unknown-linux-gnu -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar -czf ../../../tscode-aarch64-unknown-linux-gnu.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: tscode-aarch64-unknown-linux-gnu.tar.gz

  build-linux-armv7:
    name: Build Linux ARM32 (ARMv7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target armv7-unknown-linux-gnueabihf -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/armv7-unknown-linux-gnueabihf/release
          tar -czf ../../../tscode-armv7-unknown-linux-gnueabihf.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7
          path: tscode-armv7-unknown-linux-gnueabihf.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/x86_64-apple-darwin/release
          tar -czf ../../../tscode-x86_64-apple-darwin.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: tscode-x86_64-apple-darwin.tar.gz

  build-macos-aarch64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure cargo git fetch
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-aarch64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin -p tscode

      - name: Package binary (tar.gz)
        run: |
          cd target/aarch64-apple-darwin/release
          tar -czf ../../../tscode-aarch64-apple-darwin.tar.gz tscode

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: tscode-aarch64-apple-darwin.tar.gz

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-linux-armv7
      - build-macos-x86_64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}