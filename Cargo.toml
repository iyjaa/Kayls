[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["izra mulya putra G. <izramulyaputra@gmail.com>"]
license = "MIT"
repository = "https://github.com/iyjaa/Tscode"
build = "build.rs"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
crossterm = "0.28"
ratatui = "0.29"
ropey = "1.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"