[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.1.3"
edition = "2021"
authors = ["izra mulya putra G. <izramulyaputra@gmail.com>"]
license = "MIT"
repository = "https://github.com/iyjaa/Tscode"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
crossterm = "0.28"
ratatui = "0.30"
ropey = "1.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
tower-lsp = "0.20"
lsp-types = "0.94"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"