[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["izra mulya putra G. <izramulyaputra@gmail.com>"]
license = "MIT"
repository = "https://github.com/iyjaa/Kayls"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
crossterm = "0.29"
ratatui = "0.30"
wasmtime = "26"
ropey = "1.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"