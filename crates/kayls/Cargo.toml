[package]
name = "kayls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal Studio Code — A terminal-based IDE inspired by VS Code"
build = "build.rs"

[[bin]]
name = "kayls"
path = "src/main.rs"

[dependencies]
kayls-core = { path = "../kayls-core" }
kayls-tui = { path = "../kayls-tui" }
anyhow = { workspace = true }
clap = { workspace = true }

[package.metadata.deb]
maintainer = "izra mulya putra G. <izramulyaputra@gmail.com>"
copyright = "2026, izra mulya putra G."
license-file = ["../../LICENSE", "0"]
extended-description = """\
Terminal Studio Code — A terminal-based IDE inspired by VS Code.

Features:
- Editor with syntax highlighting (tree-sitter)
- Recursive file tree with expand/collapse
- Vim-style command mode
- Support for multiple languages
"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/kayls", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/kayls/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/kayls/LICENSE", "644"],
]
[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
ropey = { workspace = true }

[[bench]]
name = "core"
harness = false

[[bench]]
name = "micro"
harness = false
